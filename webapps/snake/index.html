<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Snake GRAM</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">

<style>
    :root{
        --bg1:#020b08;
        --bg2:#061812;
        --bg3:#03100b;
        --mint:#59ffc3;
        --green:#1fda8d;
        --green2:#0f9e67;
        --green3:#083a28;
        --gold:#ffd76b;
        --gold2:#ffb52b;
        --red:#ff606e;
        --red2:#ff9b7d;
        --blue:#62d7ff;
        --purple:#b184ff;
        --white:#ffffff;
    }

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        user-select:none;
        -webkit-user-select:none;
        -webkit-tap-highlight-color:transparent;
        touch-action:none;
        font-family:Inter,"Segoe UI",Arial,sans-serif;
    }

    html,body{
        width:100%;
        height:100%;
        overflow:hidden;
        background:#020b08;
    }

    body{
        position:fixed;
        inset:0;
    }

    #game{
        position:fixed;
        inset:0;
        width:100vw;
        height:100vh;
        display:block;
        background:#0d2a1f;
        filter:saturate(1.5);
    }

    .hud{
        position:fixed;
        top:calc(env(safe-area-inset-top) + 56px);
        left:50%;
        transform:translateX(-50%);
        z-index:30;
        min-width:168px;
        height:50px;
        padding:0 20px;
        border-radius:999px;
        display:flex;
        align-items:center;
        justify-content:center;
        gap:10px;
        background:rgba(7,18,14,.74);
        border:1px solid rgba(255,255,255,.11);
        box-shadow:
            0 18px 44px rgba(0,0,0,.34),
            inset 0 1px 0 rgba(255,255,255,.14),
            0 0 26px rgba(89,255,195,.10);
        backdrop-filter:blur(18px);
    }

    #gram{
        font-size:25px;
        font-weight:900;
        line-height:1;
        letter-spacing:-.04em;
        color:var(--mint);
        font-variant-numeric:tabular-nums;
        text-shadow:0 0 16px rgba(89,255,195,.34);
    }

    .hud .label{
        font-size:12px;
        font-weight:900;
        letter-spacing:.14em;
        color:rgba(245,255,250,.62);
    }

    .controls{
        position:fixed;
        left:50%;
        bottom:calc(env(safe-area-inset-bottom) + 14px);
        transform:translateX(-50%);
        z-index:30;
        width:218px;
        height:148px;
        display:grid;
        grid-template-columns:repeat(3,66px);
        grid-template-rows:repeat(2,66px);
        gap:8px;
        justify-content:center;
        align-content:center;
    }

    .btn{
        border:none;
        outline:none;
        border-radius:22px;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:30px;
        font-weight:900;
        color:rgba(255,255,255,.87);
        background:
            radial-gradient(circle at 35% 22%, rgba(255,255,255,.16), transparent 33%),
            linear-gradient(180deg, rgba(255,255,255,.11), rgba(255,255,255,.045));
        border:1px solid rgba(255,255,255,.12);
        box-shadow:
            0 16px 30px rgba(0,0,0,.34),
            inset 0 1px 0 rgba(255,255,255,.16);
        backdrop-filter:blur(16px);
        transition:transform .08s ease, box-shadow .08s ease, color .08s ease;
        cursor:pointer;
    }

    .btn:active{
        transform:scale(.91);
        color:var(--mint);
        box-shadow:
            0 10px 22px rgba(0,0,0,.34),
            0 0 26px rgba(89,255,195,.18),
            inset 0 1px 0 rgba(255,255,255,.18);
    }

    .up{grid-column:2;grid-row:1;}
    .left{grid-column:1;grid-row:2;}
    .down{grid-column:2;grid-row:2;}
    .right{grid-column:3;grid-row:2;}

    .overlay{
        position:fixed;
        inset:0;
        z-index:50;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:18px;
        background:rgba(1,8,6,.58);
        backdrop-filter:blur(11px);
        transition:opacity .22s ease, visibility .22s ease;
    }

    .overlay.hidden{
        opacity:0;
        visibility:hidden;
        pointer-events:none;
    }

    .modal{
        width:min(92vw,440px);
        border-radius:34px;
        padding:46px 32px 32px;
        text-align:center;
        background:
            radial-gradient(circle at 50% 0%, rgba(89,255,195,.13), transparent 44%),
            linear-gradient(180deg, rgba(255,255,255,.095), rgba(255,255,255,.04));
        border:1px solid rgba(255,255,255,.12);
        box-shadow:
            0 26px 80px rgba(0,0,0,.44),
            inset 0 1px 0 rgba(255,255,255,.13);
        animation:modalIn .28s ease both;
        will-change:transform,opacity;
    }

    @keyframes modalIn{
        from{transform:scale(.93) translateY(8px);opacity:0;}
        to{transform:scale(1) translateY(0);opacity:1;}
    }

    .iconWrap{ display:none; }

    @keyframes floatIcon{
        0%,100%{transform:translateY(0) rotate(-2deg);}
        50%{transform:translateY(-6px) rotate(2deg);}
    }

    .modal h1{
        font-size:54px;
        line-height:.95;
        font-weight:900;
        letter-spacing:-.05em;
        color:#f6fff9;
        margin-bottom:22px;
    }

    .result{
        display:none;
        margin-bottom:28px;
        font-size:22px;
        font-weight:800;
        color:rgba(255,255,255,.92);
    }

    .result b{
        color:var(--mint);
        text-shadow:0 0 14px rgba(89,255,195,.28);
    }

    .start{
        width:100%;
        height:68px;
        border:none;
        outline:none;
        border-radius:999px;
        font-size:20px;
        font-weight:900;
        letter-spacing:.08em;
        color:#062316;
        background:
            radial-gradient(circle at 32% 20%, rgba(255,255,255,.34), transparent 22%),
            linear-gradient(135deg, var(--mint), var(--green));
        box-shadow:
            0 16px 34px rgba(31,218,141,.22),
            inset 0 1px 0 rgba(255,255,255,.48);
        cursor:pointer;
        transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
    }

    .start:hover{
        filter:brightness(1.12);
        box-shadow:
            0 20px 44px rgba(31,218,141,.30),
            inset 0 1px 0 rgba(255,255,255,.52);
    }

    .start:active{
        transform:scale(.96);
        filter:brightness(.95);
        box-shadow:
            0 8px 20px rgba(31,218,141,.18),
            inset 0 1px 0 rgba(255,255,255,.38);
    }

    .modalActions{
        display:flex;
        flex-direction:column;
        gap:12px;
    }

    .claim{
        width:100%;
        height:62px;
        border:none;
        outline:none;
        border-radius:999px;
        font-size:16px;
        font-weight:900;
        letter-spacing:.08em;
        color:#ffe7dc;
        background:
            radial-gradient(circle at 32% 20%, rgba(255,255,255,.26), transparent 26%),
            linear-gradient(135deg, #ff9a7c, #ff606e);
        box-shadow:
            0 16px 34px rgba(255,96,110,.24),
            inset 0 1px 0 rgba(255,255,255,.34);
        cursor:pointer;
        transition:transform .12s ease, box-shadow .12s ease, filter .12s ease, opacity .12s ease;
    }

    .claim:hover{
        filter:brightness(1.08);
        box-shadow:
            0 20px 44px rgba(255,96,110,.30),
            inset 0 1px 0 rgba(255,255,255,.48);
    }

    .claim:active{
        transform:scale(.96);
        filter:brightness(.95);
    }

    .claim:disabled{
        opacity:.58;
        cursor:not-allowed;
    }

    .hiddenAction{
        display:none;
    }

    .claimStatus{
        min-height:20px;
        margin-top:10px;
        font-size:13px;
        font-weight:700;
        letter-spacing:.02em;
        color:rgba(240,255,248,.72);
    }

    .claimStatus.ok{
        color:#8dffcf;
    }

    .claimStatus.warn{
        color:#ffd7a7;
    }

    .sessionInfo{
        margin:-6px 0 18px;
        font-size:12px;
        font-weight:700;
        letter-spacing:.05em;
        color:rgba(240,255,248,.62);
        text-transform:uppercase;
    }

    .statusBar{
        position:fixed;
        top:0;
        left:0;
        width:100%;
        height:0;
        pointer-events:none;
        display:none;
    }
    .statusBar_unused{
        position:fixed;
        top:calc(env(safe-area-inset-top) + 70px);
        left:50%;
        transform:translateX(-50%);
        z-index:25;
        display:flex;
        flex-direction:column;
        gap:8px;
        align-items:center;
        pointer-events:none;
    }

    .status{
        position:fixed;
        z-index:31;
        height:50px;
        min-width:108px;
        padding:0 16px;
        border-radius:999px;
        background:rgba(7,18,14,.78);
        border:1px solid rgba(255,255,255,.13);
        backdrop-filter:blur(18px);
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        gap:2px;
        pointer-events:none;
        will-change:transform,opacity;
        box-shadow:
            0 18px 44px rgba(0,0,0,.34),
            inset 0 1px 0 rgba(255,255,255,.14);
    }
    .status.slot-right{
        top:calc(env(safe-area-inset-top) + 56px);
        left:calc(50% + 96px);
        animation:statusSideIn .28s cubic-bezier(.25,1.4,.4,1) both;
    }
    .status.slot-left{
        top:calc(env(safe-area-inset-top) + 56px);
        right:calc(50% + 96px);
        animation:statusSideIn .28s cubic-bezier(.25,1.4,.4,1) both;
    }
    .status.slot-top{
        top:calc(env(safe-area-inset-top) + 4px);
        left:50%;
        transform:translateX(-50%);
        animation:statusTopIn .28s cubic-bezier(.25,1.4,.4,1) both;
    }
    .status.slot-right.fadeOut,
    .status.slot-left.fadeOut{
        animation:statusSideOut .22s ease both;
    }
    .status.slot-top.fadeOut{
        animation:statusTopOut .22s ease both;
    }
    .status_unused{
        min-width:128px;
        padding:8px 16px 7px;
        border-radius:18px;
        background:rgba(7,18,14,.78);
        border:1px solid rgba(255,255,255,.13);
        box-shadow:
            0 14px 32px rgba(0,0,0,.36),
            inset 0 1px 0 rgba(255,255,255,.14);
        backdrop-filter:blur(14px);
        text-align:center;
        animation:statusIn .26s cubic-bezier(.25,1.4,.4,1) both;
        will-change:transform,opacity;
    }

    /* fadeOut handled per-slot above */

    .status .stLabel{
        font-size:9.5px;
        letter-spacing:.16em;
        font-weight:900;
        color:rgba(255,255,255,.66);
        white-space:nowrap;
    }

    .status .stTimer{
        font-size:20px;
        font-weight:900;
        line-height:1;
        font-variant-numeric:tabular-nums;
        margin-top:3px;
        letter-spacing:-.02em;
    }

    .status.speed{
        border-color:rgba(255,215,107,.30);
        box-shadow:
            0 14px 32px rgba(0,0,0,.36),
            0 0 24px rgba(255,215,107,.18),
            inset 0 1px 0 rgba(255,255,255,.18);
    }

    .status.speed .stLabel{ color:rgba(255,225,150,.85); }
    .status.speed .stTimer{
        color:#ffd76b;
        text-shadow:0 0 16px rgba(255,215,107,.55);
    }

    .status.shield{
        border-color:rgba(180,240,255,.30);
        box-shadow:
            0 14px 32px rgba(0,0,0,.36),
            0 0 24px rgba(180,240,255,.18),
            inset 0 1px 0 rgba(255,255,255,.18);
    }

    .status.shield .stLabel{ color:rgba(220,245,255,.86); }
    .status.shield .stTimer{
        color:#ffffff;
        text-shadow:0 0 16px rgba(255,255,255,.55);
    }

    .status.magnet{
        border-color:rgba(255,140,180,.30);
        box-shadow:
            0 14px 32px rgba(0,0,0,.36),
            0 0 24px rgba(255,140,180,.18),
            inset 0 1px 0 rgba(255,255,255,.18);
    }

    .status.magnet .stLabel{ color:rgba(255,210,225,.88); }
    .status.magnet .stTimer{
        color:#ff7eb4;
        text-shadow:0 0 16px rgba(255,125,180,.55);
    }

    @keyframes statusSideIn{
        from{transform:translateY(-10px) scale(.85);opacity:0;}
        to{transform:translateY(0) scale(1);opacity:1;}
    }

    @keyframes statusSideOut{
        from{transform:translateY(0) scale(1);opacity:1;}
        to{transform:translateY(-10px) scale(.85);opacity:0;}
    }

    @keyframes statusTopIn{
        from{transform:translateX(-50%) translateY(-12px) scale(.85);opacity:0;}
        to{transform:translateX(-50%) translateY(0) scale(1);opacity:1;}
    }

    @keyframes statusTopOut{
        from{transform:translateX(-50%) translateY(0) scale(1);opacity:1;}
        to{transform:translateX(-50%) translateY(-12px) scale(.85);opacity:0;}
    }

    @media (max-height:700px){
        .hud{top:calc(env(safe-area-inset-top) + 50px);height:44px;}
        .status{height:42px;min-width:90px;padding:4px 11px;}
        .status.slot-right{top:calc(env(safe-area-inset-top) + 51px);left:calc(50% + 86px);}
        .status.slot-left{top:calc(env(safe-area-inset-top) + 51px);right:calc(50% + 86px);}
        .status.slot-top{top:calc(env(safe-area-inset-top) + 4px);}
        #gram{font-size:22px;}
        .controls{
            bottom:calc(env(safe-area-inset-bottom) + 8px);
            width:194px;
            height:126px;
            grid-template-columns:repeat(3,59px);
            grid-template-rows:repeat(2,59px);
            gap:7px;
        }
        .btn{border-radius:19px;font-size:26px;}
        .modal{padding:36px 24px 24px;border-radius:28px;width:min(92vw,400px);}
        .modal h1{font-size:46px;margin-bottom:18px;}
        .result{font-size:19px;margin-bottom:22px;}
        .start{height:60px;font-size:18px;}
        .claim{height:56px;font-size:15px;}
    }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div class="hud">
    <div id="gram">0</div>
    <div class="label">GRAM</div>
</div>

<div class="statusBar" id="statusBar"></div>

<div id="overlay" class="overlay">
    <div class="modal">
        <div class="iconWrap">🐍</div>
        <h1 id="title">SNAKE GRAM</h1>
        <div id="sessionInfo" class="sessionInfo">Session</div>
        <div id="result" class="result">Ваш результат: <b id="finalScore">0</b> GRAM</div>
        <div class="modalActions">
            <button id="claimBtn" class="claim hiddenAction">ПОЛУЧИТЬ</button>
            <button id="startBtn" class="start">НАЧАТЬ ИГРУ</button>
        </div>
        <div id="claimStatus" class="claimStatus"></div>
    </div>
</div>

<script>
(async () => {
    "use strict";

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    // Globally disable shadowBlur — its glow halos tint the whole frame and shift the
    // perceived background colour. All assignments to ctx.shadowBlur are silently ignored.
    try {
        Object.defineProperty(ctx, "shadowBlur", {
            get(){ return 0; },
            set(){},
            configurable: true
        });
    } catch(e){}

    const gramEl = document.getElementById("gram");
    const overlay = document.getElementById("overlay");
    const titleEl = document.getElementById("title");
    const resultEl = document.getElementById("result");
    const finalScoreEl = document.getElementById("finalScore");
    const sessionInfoEl = document.getElementById("sessionInfo");
    const startBtn = document.getElementById("startBtn");
    const claimBtn = document.getElementById("claimBtn");
    const claimStatusEl = document.getElementById("claimStatus");

    let audioCtx = null;

    let dpr = 1, vw = 0, vh = 0;
    let cell = 24, cols = 18, rows = 18;
    let boardX = 0, boardY = 0, boardW = 0, boardH = 0;

    const SAFE_TOP = 122;
    const SAFE_BOTTOM = 92;
    const SPAWN_MARGIN = 1;
    const DANGER_ZONE_SIZE = 5;
    const DANGER_ZONE_PADDING = 3;
    const DANGER_MIN_INTERVAL = 5000;
    const DANGER_MAX_INTERVAL = 11000;
    const DANGER_MIN_WARN = 4000;
    const DANGER_MAX_WARN = 6000;

    const urlParams = new URLSearchParams(window.location.search);
    function readNonNegativeIntParam(name, fallback){
        const raw = parseInt(urlParams.get(name) || "", 10);
        return Number.isFinite(raw) ? Math.max(0, raw) : fallback;
    }
    const snakeMaxPayout = readNonNegativeIntParam("max", 999999);
    const snakeServerPayout = Math.min(
        snakeMaxPayout,
        readNonNegativeIntParam("payout", snakeMaxPayout)
    );
    const sessionCfg = {
        sessionId: parseInt(urlParams.get("sid") || "0", 10) || 0,
        userId: parseInt(urlParams.get("uid") || "0", 10) || 0,
        ticketPrice: Math.max(0, readNonNegativeIntParam("price", 0)),
        maxPayout: snakeMaxPayout,
        serverPayout: snakeServerPayout,
        currency: String(urlParams.get("currency") || "GRAM"),
        botUsername: String(urlParams.get("bot") || "").replace(/^@/, "").trim()
    };
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    const SESSION_LOCK_KEY = "snake_pro_active_session_lock_v2";
    const lockOwner = `${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 10)}`;
    let lockOwned = false;
    let sessionConsumed = false;
    let claimInFlight = false;
    let autoClaimTriggered = false;
    let autoClaimFallbackTimer = null;
    let autoClaimFallbackOpened = false;


    function clampSnakePayout(rawValue){
        const parsed = Number.isFinite(rawValue) ? Math.floor(rawValue) : 0;
        const safe = Math.max(0, parsed);
        if(sessionCfg.serverPayout > 0){
            const capped = Math.min(sessionCfg.serverPayout, safe);
            return capped;
        }
        return safe;
    }

    function clearAutoClaimFallback(){
        if(autoClaimFallbackTimer){
            clearTimeout(autoClaimFallbackTimer);
            autoClaimFallbackTimer = null;
        }
    }

    const COLORS = {
        mint:"#59ffc3",
        green:"#1fda8d",
        green2:"#0f9e67",
        green3:"#083a28",
        gold:"#ffd76b",
        gold2:"#ffb52b",
        red:"#ff606e",
        red2:"#ff9b7d",
        blue:"#62d7ff",
        purple:"#b184ff",
        white:"#ffffff",
        dark:"#052218"
    };

    const ITEM_TYPES = {
        coin:      { chance:62, points:[100,300], grow:1, color:COLORS.gold  },
        lightning: { chance:16, points:[140,260], grow:0, color:"#9ed6ff"   },
        shield:    { chance:12, points:[120,220], grow:0, color:COLORS.white },
        magnet:    { chance:10, points:[140,260], grow:0, color:"#ff7eb4"   }
    };

    const state = {
        running:false,
        over:false,

        snake:[],
        prevSnake:[],
        dir:{x:1,y:0},
        next:{x:1,y:0},
        locked:false,

        gram:0,
        grow:0,
        shieldUntil:0,
        speedUntil:0,
        magnetUntil:0,

        items:[],
        particles:[],
        waves:[],
        texts:[],
        trails:[],
        sparkles:[],
        snakeWaves:[],
        dangerZones:[],
        blasts:[],
        backgroundBlobs:[],

        tick:142,
        tickBase:142,
        acc:0,
        last:0,
        time:0,
        glow:0,
        shake:0,
        worldFlash:0,
        nextDangerAt:0,
        roundId:"",
        roundStartedAt:0,
        roundEndedAt:0,
        claimSent:false,
        sessionBlocked:false,
        blinkAt: 2400,
        blinkTimer: 0
    };

    function formatSessionId(value){
        const num = parseInt(String(value || "0"), 10) || 0;
        return num > 0 ? String(num) : "LOCAL";
    }

    function updateSessionLabel(){
        if(!sessionInfoEl) return;
        sessionInfoEl.textContent = `SESSION ${formatSessionId(sessionCfg.sessionId)}`;
    }

    function setClaimStatus(text, type){
        claimStatusEl.textContent = text || "";
        claimStatusEl.classList.remove("ok", "warn");
        if(type) claimStatusEl.classList.add(type);
    }

    function canUseStorage(){
        try{
            const key = "__snake_lock_test__";
            localStorage.setItem(key, "1");
            localStorage.removeItem(key);
            return true;
        } catch(e){
            return false;
        }
    }

    function cloudStorageAvailable(){
        return Boolean(
            tg &&
            tg.CloudStorage &&
            typeof tg.CloudStorage.getItem === "function" &&
            typeof tg.CloudStorage.setItem === "function" &&
            typeof tg.CloudStorage.removeItem === "function"
        );
    }

    function cloudGetItem(key){
        return new Promise((resolve) => {
            if(!cloudStorageAvailable()){
                resolve("");
                return;
            }
            tg.CloudStorage.getItem(key, (err, value) => {
                resolve(err ? "" : String(value || ""));
            });
        });
    }

    function cloudSetItem(key, value){
        return new Promise((resolve) => {
            if(!cloudStorageAvailable()){
                resolve(false);
                return;
            }
            tg.CloudStorage.setItem(key, value, (err) => {
                resolve(!err);
            });
        });
    }

    function cloudRemoveItem(key){
        return new Promise((resolve) => {
            if(!cloudStorageAvailable()){
                resolve(false);
                return;
            }
            tg.CloudStorage.removeItem(key, (err) => {
                resolve(!err);
            });
        });
    }

    function parseLock(raw){
        if(!raw) return null;
        try{
            const data = JSON.parse(raw);
            if(!data || typeof data !== "object") return null;
            return {
                sid: parseInt(String(data.sid || "0"), 10) || 0,
                owner: String(data.owner || ""),
                ts: parseInt(String(data.ts || "0"), 10) || 0,
                consumed: Boolean(data.consumed)
            };
        } catch(e){
            return null;
        }
    }

    async function readSessionLock(){
        if(cloudStorageAvailable()){
            return parseLock(await cloudGetItem(SESSION_LOCK_KEY));
        }
        if(!canUseStorage()) return null;
        return parseLock(localStorage.getItem(SESSION_LOCK_KEY));
    }

    async function writeSessionLock(payload){
        const raw = JSON.stringify(payload);
        if(cloudStorageAvailable()){
            return await cloudSetItem(SESSION_LOCK_KEY, raw);
        }
        if(!canUseStorage()) return false;
        try{
            localStorage.setItem(SESSION_LOCK_KEY, raw);
            return true;
        } catch(e){
            return false;
        }
    }

    async function removeSessionLock(){
        if(cloudStorageAvailable()){
            return await cloudRemoveItem(SESSION_LOCK_KEY);
        }
        if(!canUseStorage()) return false;
        try{
            localStorage.removeItem(SESSION_LOCK_KEY);
            return true;
        } catch(e){
            return false;
        }
    }

    async function acquireSessionLock(){
        if(sessionCfg.sessionId <= 0){
            lockOwned = true;
            return true;
        }
        if(!cloudStorageAvailable() && !canUseStorage()){
            lockOwned = true;
            return true;
        }

        const now = Date.now();
        const lockFreshMs = 20 * 60 * 1000;
        const current = await readSessionLock();

        if(current && current.sid === sessionCfg.sessionId){
            if(current.consumed){
                lockOwned = false;
                sessionConsumed = true;
                return false;
            }
            if(current.owner && current.owner !== lockOwner && now - current.ts <= lockFreshMs){
                lockOwned = false;
                return false;
            }
        }

        const next = { sid: sessionCfg.sessionId, owner: lockOwner, ts: now, consumed: false };
        if(!await writeSessionLock(next)){
            lockOwned = false;
            return false;
        }
        const verify = await readSessionLock();
        lockOwned = Boolean(verify && verify.sid === sessionCfg.sessionId && verify.owner === lockOwner);
        return lockOwned;
    }

    async function markSessionAsConsumed(){
        sessionConsumed = true;
        if(sessionCfg.sessionId <= 0 || (!cloudStorageAvailable() && !canUseStorage())) return;
        await writeSessionLock({
            sid: sessionCfg.sessionId,
            owner: lockOwner,
            ts: Date.now(),
            consumed: true
        });
        lockOwned = true;
    }

    async function releaseSessionLock(force){
        if(sessionCfg.sessionId <= 0 || (!cloudStorageAvailable() && !canUseStorage())) return;
        if(!force && sessionConsumed) return;
        const current = await readSessionLock();
        if(current && current.sid === sessionCfg.sessionId && current.owner === lockOwner){
            await removeSessionLock();
        }
        lockOwned = false;
    }

    function blockSessionScreen(message){
        state.sessionBlocked = true;
        state.running = false;
        state.over = true;
        titleEl.textContent = "СЕССИЯ ЗАВЕРШЕНА";
        resultEl.style.display = "none";
        claimBtn.classList.add("hiddenAction");
        startBtn.classList.add("hiddenAction");
        setClaimStatus(message || "Эту игровую сессию уже использовали.", "warn");
        overlay.classList.remove("hidden");
    }

    function resize(){
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        vw = window.innerWidth;
        vh = window.innerHeight;

        canvas.width = Math.floor(vw * dpr);
        canvas.height = Math.floor(vh * dpr);
        canvas.style.width = vw + "px";
        canvas.style.height = vh + "px";
        ctx.setTransform(dpr,0,0,dpr,0,0);

        const availableW = Math.max(260, vw - 22);
        const availableH = Math.max(260, vh - SAFE_TOP - SAFE_BOTTOM);

        cell = Math.floor(Math.min(29, Math.max(18, Math.min(availableW / 18, availableH / 18))));
        cols = Math.max(14, Math.floor(availableW / cell));
        rows = Math.max(14, Math.floor(availableH / cell));

        boardW = cols * cell;
        boardH = rows * cell;
        boardX = Math.floor((vw - boardW) / 2);
        boardY = Math.floor(SAFE_TOP + (availableH - boardH) / 2);

        createBackgroundBlobs();

        if (!state.snake.length) {
            buildSnake();
        } else {
            keepInside();
            filterItems();
            filterDangerZones();
            let safety = 12;
            while (state.items.length < 4 && safety-- > 0) {
                const before = state.items.length;
                spawnItem();
                if (state.items.length === before) break;
            }
        }
    }

    function createBackgroundBlobs(){
        state.backgroundBlobs = [
        ];
    }

    function buildSnake(){
        state.snake = [];
        const sx = Math.floor(cols / 2);
        const sy = Math.floor(rows / 2);
        for(let i=0;i<5;i++) state.snake.push({x:sx-i,y:sy,popAt:0});
        state.prevSnake = cloneSnake();
    }

    function keepInside(){
        for(const p of state.snake){
            p.x = Math.max(0, Math.min(cols - 1, p.x));
            p.y = Math.max(0, Math.min(rows - 1, p.y));
        }
    }

    function filterItems(){
        state.items = state.items.filter(i =>
            i.x >= SPAWN_MARGIN &&
            i.y >= SPAWN_MARGIN &&
            i.x <= cols - 1 - SPAWN_MARGIN &&
            i.y <= rows - 1 - SPAWN_MARGIN
        );
    }

    function filterDangerZones(){
        state.dangerZones = state.dangerZones.filter(z => {
            if(z.x < SPAWN_MARGIN || z.y < SPAWN_MARGIN) return false;
            if(z.x + z.size - 1 > cols - 1 - SPAWN_MARGIN) return false;
            if(z.y + z.size - 1 > rows - 1 - SPAWN_MARGIN) return false;
            return true;
        });
    }

    function cloneSnake(){
        return state.snake.map(p => ({x:p.x,y:p.y,popAt:p.popAt||0}));
    }

    function isShielded(){
        return state.time < state.shieldUntil;
    }

    function resetGame(){

        state.running = true;
        state.over = false;
        state.dir = {x:1,y:0};
        state.next = {x:1,y:0};
        state.locked = false;

        state.gram = 0;
        state.grow = 0;
        state.shieldUntil = 0;
        state.speedUntil = 0;
        state.magnetUntil = 0;

        state.items = [];
        state.particles = [];
        state.waves = [];
        state.texts = [];
        state.trails = [];
        state.sparkles = [];
        state.snakeWaves = [];
        state.dangerZones = [];
        state.blasts = [];

        state.tickBase = 142;
        state.tick = 142;
        state.acc = 0;
        state.last = performance.now();
        state.glow = 0;
        state.shake = 0;
        state.worldFlash = 0;
        state.nextDangerAt = state.time + randomInt(DANGER_MIN_INTERVAL, DANGER_MAX_INTERVAL);
        state.roundId = createRoundId();

    async function startGame(){
        if(state.sessionBlocked){
            blockSessionScreen("Эту игровую сессию уже закрыли.");
            return;
        }
        if(sessionConsumed){
            blockSessionScreen("Награда по этой сессии уже была получена.");
            return;
        }
        if(sessionCfg.sessionId > 0 && !lockOwned){
            const ok = await acquireSessionLock();
            if(!ok){
                blockSessionScreen("Сессия уже активна на другом устройстве.");
                return;
            }
        }
        wakeAudio();
        resetGame();
        titleEl.textContent = "SNAKE GRAM";
        startBtn.textContent = "НАЧАТЬ ИГРУ";
        overlay.classList.add("hidden");
        playSound(520, "sine", .06, .05);
        playSound(760, "triangle", .10, .04);
    }

    function showGameOver(){
        state.running = false;
        state.over = true;
        state.roundEndedAt = Date.now();
        state.gram = clampSnakePayout(state.gram);
        updateHud();

        finalScoreEl.textContent = state.gram;
        titleEl.textContent = "GAME OVER";
        resultEl.style.display = "block";
        startBtn.classList.add("hiddenAction");

        const canClaim = !state.claimSent && !sessionConsumed && !state.sessionBlocked;
        claimBtn.classList.remove("hiddenAction");
        claimBtn.textContent = canClaim ? "Получить" : "НАГРАДА ПОЛУЧЕНА";
        claimBtn.disabled = claimInFlight || !canClaim;

            setClaimStatus("Нажмите кнопку для получения награды.", "");
        } else if(sessionConsumed || state.claimSent) {

        const modal = overlay.querySelector('.modal');

        modal.style.animation = '';
