<style>

<script>

 for(const p of particles){const t=(now-p.start)/p.life;ctx.globalAlpha=(1-t)*(1-t);circle(ctx,sx(p.x+Math.cos(p.angle)*p.speed*t),sy(p.y+Math.sin(p.angle)*p.speed*t),tw*p.size*(1-t*.4),p.color)}ctx.globalAlpha=1;
 waves=waves.filter(e=>now-e.start<650);
 for(const e of waves){const t=(now-e.start)/650;ctx.globalAlpha=(1-t)*.8;ctx.strokeStyle=e.color;ctx.lineWidth=tw*.035;ctx.beginPath();ctx.arc(sx(e.x),sy(e.y),tw*(.3+t*1.8),0,tau);ctx.stroke()}ctx.globalAlpha=1;
 const chase=robots.some(r=>r.mode==='chase');
 const vignette=ctx.createRadialGradient(w/2,h/2,Math.min(w,h)*.2,w/2,h/2,Math.max(w,h)*.7);

ui.mainBtn.addEventListener('click',()=>{if(state==='title')begin();else if(state==='paused')togglePause();else if(state==='won'||state==='lost')claimReward()});

const icons={

 exit:'<svg viewBox="0 0 32 32"><path d="M15 5H7v22h8M12 16h15M21 10l6 6-6 6"/></svg>',
 robot:'<svg viewBox="0 0 32 32"><rect x="7" y="10" width="18" height="16" rx="5"/><path d="M16 5v5M3 15v7M29 15v7M11 18h2M19 18h2M12 23h8"/><circle cx="16" cy="4" r="1.5"/></svg>',
 pause:'<svg viewBox="0 0 32 32"><path d="M11 7v18M21 7v18"/></svg>',
 smallPause:'<svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>',
 play:'<svg viewBox="0 0 24 24"><path d="m8 4 12 8-12 8Z"/></svg>',

};
let audio=null,soundEnabled=true,lastHaptic=0,layoutFrame=0,lastViewport={w:0,h:0};
const audioSupported=!!(window.AudioContext||window.webkitAudioContext);
function unlockAudio(){
 if(!soundEnabled||!audioSupported)return;
 try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume().catch(()=>{})}catch{soundEnabled=false;syncSound()}
}
function playSound(kind){
 if(!soundEnabled||!audio||audio.state!=='running')return;
 const sequences={coin:[[880,0,.07],[1320,.06,.11]],power:[[440,0,.07],[660,.07,.09],[880,.13,.12]],boost:[[180,0,.12],[540,.08,.17]],shield:[[640,0,.12],[960,.08,.17]],win:[[523,0,.13],[659,.12,.13],[784,.24,.13],[1047,.38,.27]],lose:[[330,0,.15],[247,.12,.18],[165,.27,.27]]};
 try{
  for(const[freq,delay,duration]of sequences[kind]||[]){
   const t=audio.currentTime+delay,osc=audio.createOscillator(),gain=audio.createGain();osc.type=kind==='boost'?'triangle':'sine';
   osc.frequency.setValueAtTime(freq,t);gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.055,t+.008);gain.gain.exponentialRampToValueAtTime(.0001,t+duration);
   osc.connect(gain);gain.connect(audio.destination);osc.start(t);osc.stop(t+duration+.015);osc.onended=()=>{osc.disconnect();gain.disconnect()};
  }
 }catch{}
}
function syncSound(){ui.soundBtn.innerHTML=soundEnabled?icons.sound:icons.muted;ui.soundBtn.setAttribute('aria-label',soundEnabled?'Выключить звук':'Включить звук');ui.soundBtn.setAttribute('aria-pressed',String(soundEnabled));ui.soundBtn.hidden=!audioSupported}
function haptic(kind){
 const now=performance.now();if(!telegram||!supportsTelegram('6.1')||now-lastHaptic<120)return;lastHaptic=now;
 try{if(kind==='success'||kind==='error')telegram.HapticFeedback?.notificationOccurred(kind);else telegram.HapticFeedback?.impactOccurred(kind)}catch{}
}
function supportsTelegram(version){try{return!!(telegram&&telegram.isVersionAtLeast(version))}catch{return false}}
function updateStatus(now){
 let text='НАЙДИ ВЫХОД',mode='quiet';
 if(state==='paused')text='ПАУЗА';
 else if(state==='won')text='ВЫХОД НАЙДЕН';
 else if(state==='lost')text='НОВАЯ ПОПЫТКА';
 else if(state==='running'){
  if(ignorePlayerUntil>now){text='ЗАЩИТА '+Math.ceil((ignorePlayerUntil-now)/1000)+' СЕК';mode='shield'}
  else if(robots.some(r=>r.mode==='chase')){text='ПОГОНЯ';mode='chase'}
  else if(boostUntil>now)text='РЫВОК '+Math.ceil((boostUntil-now)/1000)+' СЕК';
 }
 if(ui.status.textContent!==text)ui.status.textContent=text;
 if(ui.status.dataset.mode!==mode)ui.status.dataset.mode=mode;
 arena.dataset.threat=String(mode==='chase');
}
function syncHostControls(){
 const paused=state==='paused',active=state==='running'||paused;
 ui.pauseBtn.disabled=!active;ui.pauseBtn.innerHTML=paused?icons.play:icons.smallPause;
 ui.pauseBtn.setAttribute('aria-label',paused?'Продолжить':'Пауза');ui.pauseBtn.title=paused?'Продолжить':'Пауза';
 const full=telegram?!!telegram.isFullscreen:!!document.fullscreenElement;
 ui.screenBtn.innerHTML=full?icons.collapse:icons.fullscreen;ui.screenBtn.setAttribute('aria-label',full?'Обычный экран':'На весь экран');
 ui.screenBtn.hidden=!(supportsTelegram('8.0')||(!telegram&&document.documentElement.requestFullscreen));
 if(telegram&&supportsTelegram('6.1')){try{if(state==='running')telegram.BackButton.show();else telegram.BackButton.hide()}catch{}}
}
function readViewport(){
 const vv=window.visualViewport,w=Math.max(1,Math.min(window.innerWidth||document.documentElement.clientWidth,vv?.width||Infinity));
 const browserHeight=vv?.height||window.innerHeight||document.documentElement.clientHeight;
 const hostHeight=telegram?.viewportStableHeight;
 const h=Math.max(1,Math.round(hostHeight>0?Math.min(browserHeight,hostHeight):browserHeight));
 return{w:Math.round(w),h};
}
function syncViewport(){
 layoutFrame=0;const{w,h}=readViewport(),root=document.documentElement;
 root.style.setProperty('--app-height',h+'px');root.style.setProperty('--app-width',w+'px');
 for(const side of ['top','bottom','left','right']){
  root.style.setProperty('--tg-safe-'+side,Math.max(0,Number(telegram?.safeAreaInset?.[side])||0)+'px');
  root.style.setProperty('--tg-content-'+side,Math.max(0,Number(telegram?.contentSafeAreaInset?.[side])||0)+'px');
 }
 const safe=telegram?.safeAreaInset||{},content=telegram?.contentSafeAreaInset||{};
 const usableHeight=h-(safe.top||0)-(safe.bottom||0)-(content.top||0)-(content.bottom||0);
 const usableWidth=w-(safe.left||0)-(safe.right||0)-(content.left||0)-(content.right||0);
 const landscape=usableWidth>usableHeight*1.25&&usableHeight<650&&w>=540;
 document.body.classList.toggle('landscape',landscape);
 document.body.classList.toggle('compact',usableHeight<620&&!landscape);
 document.body.classList.toggle('tiny',usableHeight<430);
 $('shell').classList.toggle('touch',coarsePointer.matches||navigator.maxTouchPoints>0||!!(telegram&&['android','ios'].includes(telegram.platform)));
 if(lastViewport.w!==w||lastViewport.h!==h){resetInput();lastViewport={w,h}}
 resizeCanvas();
}
function scheduleViewport(){if(!layoutFrame)layoutFrame=requestAnimationFrame(syncViewport)}
function initTelegram(){
 if(telegram)return;
 const app=window.Telegram?.WebApp;
 if(!app||!(app.initData||app.platform&&app.platform!=='unknown'))return;
 telegram=app;
 try{app.ready();app.expand()}catch{}
 try{if(supportsTelegram('6.1')){app.setHeaderColor('#07121b');app.setBackgroundColor('#07121b')}}catch{}
 try{if(supportsTelegram('7.10'))app.setBottomBarColor('#07121b')}catch{}
 try{if(supportsTelegram('7.7'))app.disableVerticalSwipes()}catch{}
 if(typeof app.onEvent==='function'){
  for(const event of ['safeAreaChanged','contentSafeAreaChanged','fullscreenChanged'])app.onEvent(event,()=>{scheduleViewport();syncHostControls()});
  app.onEvent('viewportChanged',event=>{if(event?.isStateStable!==false)scheduleViewport()});
  app.onEvent('fullscreenFailed',()=>{app.expand();scheduleViewport();syncHostControls()});
  app.onEvent('deactivated',()=>togglePause(true));app.onEvent('activated',scheduleViewport);
 }
 if(supportsTelegram('6.1')){try{app.BackButton.onClick(()=>togglePause(true))}catch{}}
 syncHostControls();syncViewport();
}
function requestImmersive(toggle=false){
 if(telegram){
  try{if(supportsTelegram('8.0')){if(toggle&&telegram.isFullscreen)telegram.exitFullscreen();else if(!telegram.isFullscreen)telegram.requestFullscreen()}else telegram.expand()}catch{try{telegram.expand()}catch{}}
 }else if(toggle){
  try{const promise=document.fullscreenElement?document.exitFullscreen?.():document.documentElement.requestFullscreen?.();promise?.catch(()=>{})}catch{}
 }
 scheduleViewport();
}
const keyMap={arrowup:'up',w:'up',arrowright:'right',d:'right',arrowdown:'down',s:'down',arrowleft:'left',a:'left'};
const codeMap={ArrowUp:'up',KeyW:'up',ArrowRight:'right',KeyD:'right',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left'};
function syncKeys(){keysDown.clear();for(const direction of physicalKeys.values())keysDown.add(direction)}
function resetInput(){physicalKeys.clear();keysDown.clear();releaseJoystick();lastWPress=0;lastJoystickUp=0}
window.addEventListener('keydown',e=>{
 const k=(e.key||'').toLowerCase(),dir=codeMap[e.code]||keyMap[k];
 if(k==='escape'){e.preventDefault();if(!e.repeat)togglePause();return}
 if(dir&&state==='title'){unlockAudio();begin();requestImmersive()}
 if(state!=='running')return;
 if(dir){e.preventDefault();physicalKeys.set(e.code||k,dir);syncKeys()}
 if((e.code==='KeyW'||k==='w')&&!e.repeat){const now=performance.now();if(e.ctrlKey||(lastWPress>0&&now-lastWPress<330))activateBoost(now);lastWPress=now}
},{passive:false});
window.addEventListener('keyup',e=>{physicalKeys.delete(e.code||(e.key||'').toLowerCase());syncKeys()});
ui.boostBtn.addEventListener('click',()=>{if(state==='running')activateBoost(performance.now())});
ui.pauseBtn.addEventListener('click',()=>togglePause());
ui.soundBtn.addEventListener('click',()=>{soundEnabled=!soundEnabled;try{localStorage.setItem('robot-run-sound',soundEnabled?'1':'0')}catch{}syncSound();unlockAudio();if(soundEnabled)playSound('coin')});
ui.screenBtn.addEventListener('click',()=>requestImmersive(true));
// The original start/retry handler remains responsible for game state.
ui.mainBtn.addEventListener('click',()=>{if(!runEnded){unlockAudio();requestImmersive()}});
function steerJoystick(e){
 const r=ui.joystick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,max=r.width*.32;
 let dx=e.clientX-cx,dy=e.clientY-cy,d=Math.hypot(dx,dy);
 if(d>max){dx*=max/d;dy*=max/d;d=max}
 const dead=max*.10,strength=d<=dead?0:Math.min(1,(d-dead)/(max-dead));
 joystickInput=d?{x:dx/d*strength,y:dy/d*strength}:{x:0,y:0};
 ui.joystickKnob.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;ui.joystick.classList.add('active');
}
function releaseJoystick(e){
 if(e&&joystickGestureStart&&state==='running'){
  const r=ui.joystick.getBoundingClientRect(),dx=e.clientX-joystickGestureStart.x,dy=e.clientY-joystickGestureStart.y;
  const up=dy<-r.height*.25&&Math.abs(dy)>Math.abs(dx)*1.15;
  if(up){const now=performance.now();if(lastJoystickUp>0&&now-lastJoystickUp<420){activateBoost(now);lastJoystickUp=0}else lastJoystickUp=now}
 }
 joystickPointer=null;joystickGestureStart=null;joystickInput={x:0,y:0};ui.joystickKnob.style.transform='translate(-50%,-50%)';ui.joystick.classList.remove('active');
}
ui.joystick.addEventListener('pointerdown',e=>{
 e.preventDefault();if(joystickPointer!==null)return;if(state==='title'){unlockAudio();begin();requestImmersive()}else if(state==='paused'){unlockAudio();togglePause()}else if(state==='won'||state==='lost')return
 if(state!=='running'||joystickPointer!==null||(e.pointerType==='mouse'&&e.button!==0))return;
 joystickPointer=e.pointerId;joystickGestureStart={x:e.clientX,y:e.clientY};
 try{ui.joystick.setPointerCapture(e.pointerId)}catch{}steerJoystick(e);
});
ui.joystick.addEventListener('pointermove',e=>{if(e.pointerId===joystickPointer){e.preventDefault();steerJoystick(e)}});
ui.joystick.addEventListener('pointerup',e=>{if(e.pointerId===joystickPointer){e.preventDefault();releaseJoystick(e)}});
