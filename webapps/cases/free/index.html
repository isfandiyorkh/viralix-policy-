</style><script src="https://telegram.org/js/telegram-web-app.js"></script></head><body><main class="app"><section class="card"><div class="starfield"></div><div class="brand">PR <b>GRAM</b></div><div class="overline">DAILY DROP · 24H</div><h1>FREE</h1><div class="sub">ЕЖЕДНЕВНЫЙ КЕЙС · x1</div><div class="cost">СТОИМОСТЬ ОТКРЫТИЯ<strong>0 GRAM</strong></div><div class="crystal-stage" id="stage" aria-hidden="true"><div class="orbital"></div><div class="pod"><div class="pod-cap"></div><div class="pod-shell"><div class="pod-core"></div></div><div class="pod-foot"></div></div></div><div class="reel" id="reel"><div class="track idle" id="track"><div class="tile">1 000 GRAM</div><div class="tile">1 500 GRAM</div><div class="tile">2 500 GRAM</div><div class="tile">5 000 GRAM</div><div class="tile">7 000 GRAM</div><div class="tile">1 000 GRAM</div><div class="tile">1 500 GRAM</div><div class="tile">2 500 GRAM</div><div class="tile">5 000 GRAM</div><div class="tile">7 000 GRAM</div></div><div class="pointer"></div></div><div class="status" id="status" aria-live="polite">БЕСПЛАТНОЕ ОТКРЫТИЕ ДОСТУПНО</div><div class="result" id="result" aria-live="polite"></div><button class="open" id="button">ОТКРЫТЬ БЕСПЛАТНО</button><div class="fineprint" id="fineprint"></div></section></main>
<script>
window.CASE_DESIGN={"key": "free", "count": 1, "prizes": [{"amount": 1000, "weight": 40}, {"amount": 1500, "weight": 20}, {"amount": 2500, "weight": 15}, {"amount": 5000, "weight": 10}, {"amount": 7000, "weight": 15}]};
(() => {
  'use strict';
  const defaults = window.CASE_DESIGN;
  const params = new URLSearchParams(location.search);
  const tg = window.Telegram && window.Telegram.WebApp;
  const free = defaults.key === 'free';
  const stage = document.querySelector(free ? '#stage' : '#hero');
  const summary = document.querySelector(free ? '#result' : '#summary');
  const button = document.querySelector(free ? '#button' : '#open');
  const claim = document.createElement('button');
  const note = document.createElement('div');
  claim.className = 'claim';
  claim.textContent = 'ЗАБРАТЬ ПРИЗ';
  claim.hidden = true;
  note.className = 'session-note';
  note.setAttribute('role', 'status');
  button.after(claim, note);
  let session = null, invalid = false, busy = false, finished = false, sending = false;
  const sid = Number(params.get('sid'));
  const uid = Number(params.get('uid'));
  const hasSession = ['sid', 'uid', 'data'].some(key => params.has(key));
  const fmt = amount => Number(amount).toLocaleString('ru-RU') + ' ' + (params.get('currency') || 'GRAM');
  try {
    if (hasSession) {
      const data = JSON.parse(params.get('data') || 'null');
      if (!Number.isSafeInteger(sid) || sid <= 0 || !Number.isSafeInteger(uid) || uid <= 0 ||
          !data || data.key !== defaults.key || data.count !== defaults.count ||
          !Array.isArray(data.prizes) || data.prizes.length !== defaults.count ||
          !data.prizes.every(n => Number.isSafeInteger(n) && n >= 0 && n <= 125000) ||
          !Array.isArray(data.rewards) || !data.rewards.length ||
          !data.rewards.every(p => Number.isSafeInteger(p.amount) && p.amount >= 0 && p.amount <= 125000 && Number.isInteger(p.chance) && p.chance > 0) ||
          data.rewards.reduce((sum, p) => sum + p.chance, 0) !== 100 ||
          !data.prizes.every(n => data.rewards.some(p => p.amount === n))) {
        throw new Error('invalid session');
      }
      const telegramUid = tg && tg.initDataUnsafe && tg.initDataUnsafe.user && Number(tg.initDataUnsafe.user.id);
      if (telegramUid && telegramUid !== uid) throw new Error('wrong user');
      session = data;
      const cost = document.querySelector('.cost strong');
      if (cost) cost.textContent = fmt(data.price * data.count);
    }
  } catch {
    invalid = true;
    button.disabled = true;
    note.textContent = 'Не удалось открыть сессию. Вернитесь к сообщению бота с вашим кейсом.';
  }
  const prizes = session ? session.rewards.map(p => ({ amount: p.amount, weight: p.chance })) : defaults.prizes;
  const storageKey = session ? `prgram:case:v2:${uid}:${sid}` : null;
  const initialText = free ? 'ОТКРЫТЬ БЕСПЛАТНО' : 'ОТКРЫТЬ';
  if (!invalid) {
    note.textContent = session ? 'Приз закреплён за этим открытием. Закрытие окна его не меняет.' : 'ДЕМО · Для зачисления награды откройте кейс из бота.';
  }
  if (tg) {
    try {
      tg.ready(); tg.expand();
      if (tg.isVersionAtLeast && tg.isVersionAtLeast('6.2')) tg.enableClosingConfirmation();
    } catch { /* Older Telegram clients still render the game. */ }
  }
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const timers = [];
  const later = (fn, ms) => { const id = setTimeout(fn, ms); timers.push(id); return id; };
  const save = value => { if (storageKey) { try { localStorage.setItem(storageKey, value); } catch { /* Server session remains authoritative. */ } } };
  const read = () => { try { return storageKey && localStorage.getItem(storageKey); } catch { return null; } };
  function pickDemo() {
    const total = prizes.reduce((sum, p) => sum + p.weight, 0);
    let n = Math.random() * total;
    for (const p of prizes) { if (n < p.weight) return p.amount; n -= p.weight; }
    return prizes[prizes.length - 1].amount;
  }
  let winners = session ? session.prizes.slice() : [];
  let rows = [];
  function createTrack(reel, track, label, amount) {
    track.className = 'track';
    track.style.animation = 'none';
    track.style.transition = 'none';
    track.style.transform = 'translateX(0px)';
    track.replaceChildren();
    let winner;
    for (let i = 0; i < 56; i++) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.textContent = fmt(i === 42 ? amount : prizes[Math.floor(Math.random() * prizes.length)].amount);
      track.append(tile);
      if (i === 42) winner = tile;
    }
    return { reel, track, label, winner, amount };
  }
  function makeRows() {
    if (free) {
      return [createTrack(document.querySelector('#reel'), document.querySelector('#track'), null, winners[0])];
    }
    const lanes = document.querySelector('#lanes');
    lanes.replaceChildren();
    return winners.map(amount => {
      const lane = document.createElement('div'); lane.className = 'lane';
      const reel = document.createElement('div'); reel.className = 'reel';
      const track = document.createElement('div'); track.className = 'track';
      const pointer = document.createElement('div'); pointer.className = 'pointer';
      const label = document.createElement('div'); label.className = 'lane-result';
      reel.append(track, pointer); lane.append(reel, label); lanes.append(lane);
      return createTrack(reel, track, label, amount);
    });
  }
  function center(row) {
    const offset = row.reel.clientWidth / 2 - (row.winner.offsetLeft + row.winner.offsetWidth / 2);
    row.track.style.transform = `translateX(${offset}px)`;
  }
  function finish() {
    if (finished) return;
    timers.splice(0).forEach(clearTimeout);
    finished = true; busy = false;
    stage.classList.remove('spinning'); stage.classList.add('finished');
    rows.forEach((row, i) => {
      row.track.style.transition = 'none'; center(row); row.winner.classList.add('winner');
      if (row.label) { row.label.textContent = `ПРИЗ ${i + 1} · ${fmt(row.amount)}`; row.label.classList.add('visible'); }
    });
    summary.textContent = (free ? '' : 'ОБЩИЙ ПРИЗ · ') + fmt(winners.reduce((sum, n) => sum + n, 0));
    summary.classList.add('show');
    const status = document.querySelector('#status');
    if (status) status.textContent = session ? 'FREE · РАЗ В 24 ЧАСА В БОТЕ' : 'ДЕМОНСТРАЦИЯ';
    button.disabled = !!session;
    button.textContent = session ? 'КЕЙС ОТКРЫТ' : 'ПОВТОРИТЬ ДЕМО';
    claim.hidden = !session;
    save('finished');
  }
  function open() {
    if (invalid || busy || (session && finished)) return;
    busy = true; finished = false;
    if (!session) winners = Array.from({ length: defaults.count }, pickDemo);
    save('started');
    button.disabled = true; button.textContent = 'ОТКРЫВАЕТСЯ…';
    summary.classList.remove('show'); summary.textContent = '';
    stage.classList.remove('finished'); stage.classList.add('spinning');
    rows = makeRows();
    if (reducedMotion) { finish(); return; }
    const duration = free ? 6600 : 7600;
    // Flush layout so the first lane also starts with an actual transition.
    rows.forEach(row => { void row.track.offsetWidth; });
    rows.forEach((row, i) => {
      later(() => {
        row.track.style.transition = `transform ${duration}ms cubic-bezier(.08,.72,.10,1)`;
        center(row);
      }, 40 + i * 400);
    });
    later(finish, duration + (rows.length - 1) * 400 + 100);
  }
  function botLink() {
    const username = (params.get('bot') || 'vortex_prgrambot').replace(/^@/, '');
    if (!/^[A-Za-z][A-Za-z0-9_]{4,31}$/.test(username)) return null;
    return `https://t.me/${username}?start=casesclaim_${sid}`;
  }
  function showReturn(link, failed = false) {
    note.replaceChildren(document.createTextNode(failed
      ? 'Не удалось открыть бота. Приз сохранён. Используйте ссылку ниже или повторите нажатие. '
      : 'Подтверждение зачисления появится в чате с ботом. Если чат не открылся, используйте ссылку ниже. '));
    if (link) {
      const fallback = document.createElement('a');
      fallback.href = link;
      fallback.textContent = 'Открыть бота и получить приз';
      note.append(fallback);
    }
  }
  function claimReward() {
    if (!session || !finished || sending) return;
    sending = true; claim.disabled = true;
    const payload = { event: 'cases_round_result', game: 'cases', action: 'claim', session_id: sid };
    // query_id is optional; its absence does not make sendData available.
    // Only an explicitly identified keyboard launch may use that transport.
    const keyboardLaunch = params.get('return') === 'keyboard';
    const link = botLink();
    showReturn(link);
    try {
      if (keyboardLaunch && tg && typeof tg.sendData === 'function') {
        tg.sendData(JSON.stringify(payload));
      } else {
        if (!link) throw new Error('no return link');
        if (tg && typeof tg.openTelegramLink === 'function') {
          try { tg.openTelegramLink(link); }
          catch { window.location.assign(link); }
        } else {
          window.location.assign(link);
        }
      }
      // A link request is not a payment acknowledgement. Keep the view and the
      // fallback available; Telegram's keyboard sendData closes itself.
    } catch {
      showReturn(link, true);
    } finally {
      later(() => { sending = false; claim.disabled = false; }, 1800);
    }
  }
  button.addEventListener('click', open);
  claim.addEventListener('click', claimReward);
  window.addEventListener('resize', () => {
    if (finished) rows.forEach(center);
    else if (busy) finish();
  });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && busy) finish();
  });
  // Refreshing or reopening uses the same supplied prizes; storage never awards money.
  if (session && read()) {
    winners = session.prizes.slice(); rows = makeRows(); finish();
  }
})();
